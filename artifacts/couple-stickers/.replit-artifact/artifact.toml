kind = "web"
previewPath = "/"
title = "Couple Stickers Landing Page"
version = "1.0.0"
id = "artifacts/couple-stickers"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23262

[services.development]
run = "pnpm --filter @workspace/couple-stickers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/couple-stickers", "run", "build" ]
publicDir = "artifacts/couple-stickers/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23262"
BASE_PATH = "/"
