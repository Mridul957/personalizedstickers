[build]
  command = "pnpm --filter @workspace/couple-stickers run build"
  publish = "artifacts/couple-stickers/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PORT = "5173"
  BASE_PATH = "/"

[[redirects]]
  from = "/api/*"
  to = "https://personalizedstickers-9mjvz.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
